# ============================================================
# application-docker.properties
# Active when SPRING_PROFILES_ACTIVE=docker (set in docker-compose.yml)
# Overrides settings in application.properties that are unsafe
# or inappropriate for a containerised deployment.
# ============================================================

# ── DataSource ───────────────────────────────────────────────
# DB_HOST is set to "db" (the Compose service name) by docker-compose.yml.
# This overrides the localhost default from application.properties.
spring.datasource.url=jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:train_concierge}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false

# HikariCP — tune for a single-service container
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000

# ── JPA ──────────────────────────────────────────────────────
# Turn off SQL logging in containers — use structured logs instead.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# DDL auto is controlled via DDL_AUTO env var (default: update)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# ── Logging ──────────────────────────────────────────────────
# Production-appropriate log levels (no SQL noise)
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.trainconcierge=INFO
logging.level.org.springframework.security=WARN

# Structured log format for log aggregators (e.g. ELK, Loki)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ── Actuator ─────────────────────────────────────────────────
# Expose health and info only — do not expose env, beans, etc. in production.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# ── CORS ─────────────────────────────────────────────────────
# Restrict allowed origins to the React frontend URL (set via env var).
# The application reads this via the WebConfig / SecurityConfig beans.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Server ────────────────────────────────────────────────────
server.port=8080

# Tomcat thread pool (tune based on container CPU allocation)
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000

# Graceful shutdown — allows in-flight requests to complete
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
