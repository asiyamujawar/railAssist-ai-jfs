# ============================================================
# Application
# ============================================================
spring.application.name=train-concierge
server.port=8080

# ============================================================
# DataSource — credentials sourced from environment variables
# ============================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:train_concierge}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP defaults — tune for production)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# NOTE: ddl-auto=update is fine for local development only.
# For staging / production, set DDL_AUTO=validate and manage
# schema changes with a migration tool (Flyway or Liquibase).

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ============================================================
# Application info (shown by /actuator/info)
# ============================================================
info.app.name=AI-Powered Train Disruption Concierge
info.app.version=0.0.1-SNAPSHOT
info.app.description=Smart Seat Alert & Disruption Concierge System

# ============================================================
# Spring Security & JWT
# ============================================================
# JWT secret must be a Base64-encoded string of at least 256 bits.
# Generate with: openssl rand -base64 32
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLXNlY3JldC1rZXktZm9yLWRldmVsb3BtZW50LW9ubHk=}
# Access token expiration in milliseconds (default: 24 hours)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# Logging
# ============================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.trainconcierge=DEBUG

# ============================================================
# Smart Seat Alert — Monitoring Scheduler
# ============================================================
# Polling interval in milliseconds for the seat availability monitor.
# Production default: 60000 (1 minute)
# Override to a shorter value for development/demo: e.g. 10000 (10 seconds)
seat.alert.poll-interval-ms=${SEAT_ALERT_POLL_MS:60000}

# ============================================================
# Train Monitoring Scheduler
# ============================================================
# Set to false to disable the monitoring cycle entirely (e.g. in local dev
# when you have no live train data and don't want periodic log noise).
monitoring.enabled=${MONITORING_ENABLED:true}

# How often to run the monitoring cycle (milliseconds, fixed-delay).
# Production default: 30 seconds. Override via env variable.
monitoring.interval-ms=${MONITORING_INTERVAL_MS:30000}

# ============================================================
# Disruption Detection Engine Rules
# ============================================================
disruption.detection.min-delay-minutes=${DISRUPTION_MIN_DELAY_MINUTES:15}
disruption.detection.medium-delay-minutes=${DISRUPTION_MEDIUM_DELAY_MINUTES:15}
disruption.detection.high-delay-minutes=${DISRUPTION_HIGH_DELAY_MINUTES:60}

# ============================================================
# Alternative Train Recommendation Engine Rules
# ============================================================
disruption.recommendation.weight-arrival=${RECOMMENDATION_WEIGHT_ARRIVAL:0.35}
disruption.recommendation.weight-duration=${RECOMMENDATION_WEIGHT_DURATION:0.25}
disruption.recommendation.weight-fare=${RECOMMENDATION_WEIGHT_FARE:0.20}
disruption.recommendation.weight-seats=${RECOMMENDATION_WEIGHT_SEATS:0.20}
disruption.recommendation.min-seats-available=${RECOMMENDATION_MIN_SEATS:1}

# ============================================================
# Travel Coordination Workflow Rules
# ============================================================
coordination.hotel-buffer-minutes=${COORDINATION_HOTEL_BUFFER_MINUTES:45}
coordination.cab-buffer-minutes=${COORDINATION_CAB_BUFFER_MINUTES:15}
