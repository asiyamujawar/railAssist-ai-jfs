# ============================================================
# Test Application Properties — H2 in-memory database
# ============================================================
spring.application.name=train-concierge-test
spring.profiles.active=test
server.port=8080

# ============================================================
# H2 DataSource — in-memory for tests
# ============================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================================
# JPA / Hibernate for tests
# ============================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# ============================================================
# JWT for tests — Base64-encoded 256-bit key
# Generate with: openssl rand -base64 32
# ============================================================
jwt.secret=dGhpcy1pcy1hLXRlc3Qtc2VjcmV0LWtleS1mb3ItdW5pdC10ZXN0cy1vbmx5LTEyMzQ1Ng==
jwt.expiration-ms=3600000

# ============================================================
# Actuator — minimal exposure for tests
# ============================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.info.env.enabled=true

# ============================================================
# Application info (required by HealthController)
# ============================================================
info.app.name=AI-Powered Train Disruption Concierge
info.app.version=0.0.1-SNAPSHOT
info.app.description=Test environment

# ============================================================
# Logging — quiet for tests
# ============================================================
logging.level.root=WARN
logging.level.com.trainconcierge=INFO
logging.level.org.springframework.test=INFO

# ============================================================
# Smart Seat Alert — short interval for tests
# ============================================================
seat.alert.poll-interval-ms=5000

# ============================================================
# Train Monitoring Scheduler — disabled for tests
# ============================================================
# Disabled so tests invoke the scheduler manually rather than
# having it fire automatically at unpredictable times.
monitoring.enabled=false
monitoring.interval-ms=60000
